<!doctype html>
<html lang="ru" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#281735">
  <meta name="description" content="Найдите гонки, места рыбалки, тайники и другие занятия в GTA VI. Выбирайте категорию на карте Леониды и отмечайте места, где уже побывали.">
  <title>Атлас Леониды · Интерактивная карта GTA VI</title>
  <link rel="canonical" href="https://cosmiksoul.github.io/gta-map/">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="./favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/atlas-mark.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:url" content="https://cosmiksoul.github.io/gta-map/">
  <meta property="og:site_name" content="Атлас Леониды">
  <meta property="og:title" content="Атлас Леониды — карта активностей GTA VI">
  <meta property="og:description" content="Гонки, рыбалка, коллекции и тайники на одной карте. Выбирайте, куда отправиться, и отмечайте посещённые места.">
  <meta property="og:image" content="https://cosmiksoul.github.io/gta-map/assets/social-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Атлас Леониды — карта активностей GTA VI">
  <meta name="twitter:description" content="Гонки, рыбалка, коллекции и тайники на одной карте. Выбирайте, куда отправиться, и отмечайте посещённые места.">
  <meta name="twitter:image" content="https://cosmiksoul.github.io/gta-map/assets/social-preview.jpg">
  <meta name="twitter:image:alt" content="Обложка «Атлас Леониды» с картой GTA VI в цветах заката.">
  <link rel="stylesheet" href="./map.css?v=3">
  <script defer src="./map-icons.js?v=2"></script>
  <script defer src="./map.js?v=3"></script>
</head>
<body>
  <svg class="symbol-bank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 6h7m5 0h6M3 12h12m5 0h1M3 18h3m5 0h10"/><circle cx="12.5" cy="6" r="2.3"/><circle cx="17.5" cy="12" r="2.3"/><circle cx="8.5" cy="18" r="2.3"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9m1-7H5v12h12v-6"/></symbol>
  </svg>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="./assets/atlas-mark.svg" width="40" height="40" alt="">
      <h1>Атлас Леониды</h1><span class="game-name" lang="en">GTA VI</span>
    </div>
    <div class="search-tools">
      <label class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" aria-label="Поиск по карте" placeholder="Место или категория" autocomplete="off">
      </label>
      <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="catalog" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span>Каталог</span></button>
    </div>
    <div id="top-count" class="top-count" role="status">Загрузка карты…</div>
  </header>
  <main class="workspace">
    <button id="scrim" class="scrim" type="button" aria-label="Вернуться к карте" hidden></button>
    <aside id="catalog" class="catalog" aria-label="Каталог точек">
      <div class="filter-block">
        <div class="section-head"><h2>Слои карты</h2><button id="reset" type="button" class="text-button" hidden>Сбросить</button></div>
        <div id="layers" class="layers" role="group" aria-label="Слой карты"></div>
        <label class="category-label" for="category">Категория</label>
        <div class="category-picker">
          <span id="filter-icon" aria-hidden="true"></span>
          <select id="category"><option value="">Все категории</option></select>
        </div>
        <label class="visited-filter"><input type="checkbox" id="hide-visited"> Скрыть посещённые</label>
      </div>
      <section class="result-block" aria-labelledby="result-heading">
        <div class="section-head"><h2 id="result-heading">Список мест</h2><span id="result-count" class="count-chip">0</span></div>
        <button id="clear-group" type="button" class="text-button" hidden>Показать весь список</button>
        <div id="result-list" class="result-list"></div>
        <button id="load-more" class="secondary-button" type="button" hidden>Показать ещё</button>
      </section>
    </aside>
    <section id="map-area" class="map-area" aria-label="Карта Леониды">
      <canvas id="map" tabindex="0" aria-label="Интерактивная карта. Стрелки перемещают карту, плюс и минус меняют масштаб. Выбрать место можно в каталоге."></canvas>
      <div id="map-status" class="map-status" role="status">Загружаем карту…</div>
      <div class="map-tools" role="group" aria-label="Управление картой">
        <button id="zoom-in" type="button" aria-label="Увеличить масштаб" title="Увеличить масштаб"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="zoom-out" type="button" aria-label="Уменьшить масштаб" title="Уменьшить масштаб"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <button id="fit" type="button" aria-label="Показать все выбранные точки" title="Показать все выбранные точки"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
      <article id="detail" class="detail" aria-label="Выбранное место" hidden>
        <button id="detail-close" type="button" aria-label="Закрыть карточку" class="close-button"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        <div class="detail-category"><span id="detail-icon" aria-hidden="true"></span><span id="detail-category"></span></div>
        <h2 id="detail-name" tabindex="-1"></h2>
        <p id="detail-area" hidden></p>
        <div id="detail-sources" class="source-links" aria-label="Источники"></div>
        <button id="visit" class="visit-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>Отметить посещённым</span></button>
        <small id="save-notice" hidden>В этом браузере отметка сохранится только до закрытия страницы.</small>
      </article>
      <details class="attribution"><summary>О карте</summary>
        <div>Берега и дороги упрощены и перекрашены. <a href="https://github.com/fbritoferreira/gta6" target="_blank" rel="noopener">Open GTA 6 Map (fbritoferreira)</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></div>
        <div>Часть значков взята из <a href="./assets/lucide-LICENSE.txt" target="_blank" rel="noopener">Lucide и Feather</a>.</div>
      </details>
      <div class="north" aria-hidden="true"><span>С</span><svg width="13" height="21" viewBox="0 0 13 21"><path d="m6.5 1 5.5 17-5.5-3-5.5 3z" fill="#FFD08A"/><path d="m6.5 1 0 14-5.5 3z" fill="#F45FA8"/></svg></div>
    </section>
  </main>
  <noscript>Для интерактивной карты включите JavaScript в браузере.</noscript>
</body>
</html>
